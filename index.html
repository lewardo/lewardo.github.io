<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Portfolio of Edouard Levasseur, showcasing projects and skills in web development.">
    <meta name="keywords" content="Edouard Levasseur, portfolio, web development, projects, skills">
    <meta name="author" content="Edouard Levasseur">
    
    <link rel="icon" type="image/png" href="assets/favicon.png" >
    
    <title>Portfolio &mdash; Edouard Levasseur</title>

    <link rel="stylesheet" href="css/styles.css">
    
    <script type="text/javascript">
        if (window.location.search[1] === '/') href = window.location.search.slice(1);
        else href = 'default';

        fetch(`html/${href}.html`).then(response => {
            if (!response.ok) throw new Error('Network error');
            return response.text();
        }).then(html => {
            document.getElementById('content').innerHTML = html;
            window.history.replaceState({ path: href }, '', href);
        })
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.min.js"></script>
    <script defer src="js/main.js"></script>
</head>
<body>
    <section id="overlay" class="overlay">
        <div class="overlay__logo"></div>
        <div class="overlay__container">
            <div class="overlay__content">
                &exist;!
            </div>
        </div>
    </section>

    <section id="menu" class="menu">
        <div id="naviagtion" class="menu__navigation">
            <a href="parkour">parkour</a>
            <a href="philosophy">philo</a>
            <a href="photography">photo</a>
            <a href="projects">projects</a>
            <a href="work">work</a>
        </div>
    </section>


    <section class="content">
        <main id="content"></main>
    </section>
</body>
</html>
