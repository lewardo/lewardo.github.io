<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Portfolio of Edouard Levasseur, showcasing projects and skills in web development.">

    <!-- <link rel="stylesheet" href="css/preload.css"> -->
    
    <script type="text/javascript">
        if (window.location.search[1] === '/') {
            href = window.location.search.slice(1)

            fetch(`./html/${href}.html`).then(response => {
                if (!response.ok) throw new Error('Network error');
                return response.text();
            }).then(html => {
                document.getElementById('content').innerHTML = html;
                window.history.replaceState({ path: href }, '', href);
            })
        }
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.min.js"></script>
    <script defer src="js/main.js"></script>
</head>

        <a href="parkour">parkour</a>
    </section>

    <main id="content"></main>
</body>
</html>
